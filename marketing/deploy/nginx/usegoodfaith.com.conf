server {
    server_name usegoodfaith.com www.usegoodfaith.com;

    root /var/www/lms/marketing/dist;
    index index.html;

    access_log /var/log/nginx/usegoodfaith_access.log;
    error_log /var/log/nginx/usegoodfaith_error.log;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|woff|woff2|ttf|eot|otf)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Hashed build assets — safe to cache for a year immutably.
    # ^~ forces this prefix match to win over the regex location below.
    location ^~ /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~* \.(css|js)$ {
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss image/svg+xml;

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/usegoodfaith.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/usegoodfaith.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.usegoodfaith.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = usegoodfaith.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name usegoodfaith.com www.usegoodfaith.com;
    return 404; # managed by Certbot




}