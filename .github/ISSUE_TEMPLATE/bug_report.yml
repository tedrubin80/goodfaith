name: Bug report
description: Something is broken or incorrect
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Do not post security vulnerabilities here** — see [SECURITY.md](https://github.com/tedrubin80/goodfaith/blob/main/docs/SECURITY.md).
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What did you expect vs what you saw?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. docker compose up
        2. Sign in as manager
        3. …
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Backend / API
        - Frontend / portal
        - Royalty imports
        - Deploy / Docker
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or version (optional)
      placeholder: main @ abc1234