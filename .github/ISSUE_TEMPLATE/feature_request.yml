name: Feature request
description: Suggest an improvement or new capability
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: What label ops pain does this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      required: false
  - type: checkboxes
    id: scope
    attributes:
      label: Scope (check any that apply)
      options:
        - label: Backend API change
        - label: Frontend UI change
        - label: New migration(s)
        - label: Documentation only